services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: job_hunting
      POSTGRES_USER: job_hunting
      POSTGRES_PASSWORD: job_hunting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_hunting -d job_hunting"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: replace-with-a-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data
