name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: job_hunting
          POSTGRES_USER: job_hunting
          POSTGRES_PASSWORD: job_hunting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_hunting -d job_hunting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://job_hunting:job_hunting@localhost:5432/job_hunting
      APP_URL: http://localhost:3000
      AUTH_MODE: local
      ALLOW_LOCAL_AUTH_IN_PRODUCTION: "true"
      APP_USER_ID: 00000000-0000-4000-8000-000000000001
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DEPLOYMENT_VERSION: ci-${{ github.sha }}
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: job-hunting
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: local-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start private object storage
        run: >-
          docker run --detach --name job-hunting-minio --publish 9000:9000
          --env MINIO_ROOT_USER=minio
          --env MINIO_ROOT_PASSWORD=local-ci-placeholder
          minio/minio:latest server /data
      - name: Prepare object-storage bucket
        run: |
          for attempt in {1..30}; do
            if pnpm storage:ensure; then
              exit 0
            fi
            sleep 2
          done
          docker logs job-hunting-minio
          exit 1
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Migrate and seed PostgreSQL
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Exercise the real domain workflow
        run: pnpm test:integration
      - name: Exercise FAQ AI import and merge persistence
        run: pnpm test:faq-ai
      - name: Smoke-test production runtime
        run: |
          pnpm start > /tmp/job-hunting-web.log 2>&1 &
          app_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --output /tmp/job-hunting-health.json http://127.0.0.1:3000/api/health; then
              node --input-type=module -e "import {readFile} from 'node:fs/promises'; const d=JSON.parse(await readFile('/tmp/job-hunting-health.json','utf8')); if(d.status!=='ok'||!d.checks?.authentication||!d.checks?.database||!d.checks?.objectStorage) process.exit(1)"
              curl --fail --silent --show-error --dump-header /tmp/job-hunting-home-headers.txt --output /dev/null http://127.0.0.1:3000/
              grep --ignore-case --quiet '^x-frame-options: DENY' /tmp/job-hunting-home-headers.txt
              grep --ignore-case --quiet '^x-content-type-options: nosniff' /tmp/job-hunting-home-headers.txt
              curl --fail --silent --show-error --dump-header /tmp/job-hunting-export-headers.txt --output /tmp/job-hunting-export.json http://127.0.0.1:3000/api/export
              grep --ignore-case --quiet '^cache-control: private, no-store' /tmp/job-hunting-export-headers.txt
              grep --ignore-case --quiet '^cross-origin-resource-policy: same-origin' /tmp/job-hunting-export-headers.txt
              node --input-type=module -e "import {readFile} from 'node:fs/promises'; const d=JSON.parse(await readFile('/tmp/job-hunting-export.json','utf8')); if(d.format!=='job-hunting-web-export') process.exit(1)"
              kill "$app_pid"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/job-hunting-web.log
          docker logs job-hunting-minio
          kill "$app_pid" || true
          exit 1
